<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine externen Links</title>

<style>
body {
    font-family: Roboto, Arial, sans-serif;
    background: #0f0f0f;
    color: #ffffff;
    padding: 30px;
}

h2 {
    font-weight: 500;
    margin-bottom: 20px;
}

input, button {
    padding: 10px;
    margin: 6px 0;
    width: 320px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
}

input {
    background: #222;
    color: #fff;
}

button {
    background: #ff0000;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #cc0000;
}

a {
    color: #3ea6ff;
    text-decoration: none;
    margin-top: 8px;
    display: block;
}

hr {
    margin: 25px 0;
    border: 1px solid #333;
}
</style>
</head>

<body>

<h2>🔗 Externe Links</h2>

<input id="title" placeholder="Linktitel eingeben">
<br>
<input id="url" type="url" placeholder="https://example.com">
<br>
<button onclick="addLink()">+ Link hinzufügen</button>

<hr>

<div id="links"></div>

<script>
const linksDiv = document.getElementById("links");

function saveLinks() {
    localStorage.setItem("links", linksDiv.innerHTML);
}

function loadLinks() {
    const saved = localStorage.getItem("links");
    if (saved) {
        linksDiv.innerHTML = saved;
    }
}

function addLink() {
    const title = document.getElementById("title").value.trim();
    const url = document.getElementById("url").value.trim();

    if (!title || !url) {
        alert("Titel und URL erforderlich");
        return;
    }

    const a = document.createElement("a");
    a.href = url;
    a.textContent = title;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    linksDiv.appendChild(a);
    saveLinks();

    document.getElementById("title").value = "";
    document.getElementById("url").value = "";
}

loadLinks();
</script>

</body>
</html>
