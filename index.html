<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Externe Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 520px;
        }

        h2 {
            font-weight: 500;
            margin-bottom: 16px;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        input {
            background: #222;
            color: #fff;
        }

        button {
            font-weight: bold;
            cursor: pointer;
        }

        #addBtn {
            background: #ff0000;
            color: #fff;
        }

        #addBtn:hover {
            background: #cc0000;
        }

        .actionRow {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .linkBtn {
            background: #333;
            color: #fff;
            font-size: 13px;
            padding: 8px 10px;
            border-radius: 6px;
        }

        .linkBtn:hover {
            background: #555;
        }

        .linkContainer {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        a {
            color: #3ea6ff;
            text-decoration: none;
            word-break: break-all;
        }

        hr {
            border: none;
            border-top: 1px solid #333;
            margin: 16px 0;
        }
    </style>
</head>
<body>

<div class="app">
    <h2>🔗 Externe Links</h2>

    <input id="title" placeholder="Linktitel eingeben">
    <input id="url" type="url" placeholder="https://example.com">

    <button id="addBtn">+ Link hinzufügen</button>

    <div class="actionRow">
        <button id="restoreBtn" class="linkBtn">🔄 Laden</button>
        <button id="undoBtn" class="linkBtn">↩️ Undo</button>
    </div>

    <hr>

    <div id="links"></div>
</div>

<script>
    const linksDiv = document.getElementById("links");
    const undoStack = [];

    function saveLinks() {
        localStorage.setItem("links", linksDiv.innerHTML);
    }

    function removeDeadLink() {
        const saved = localStorage.getItem("links");
        if (!saved) return;

        const temp = document.createElement("div");
        temp.innerHTML = saved;

        temp.querySelectorAll("a").forEach(a => {
            if (a.textContent === "Ich bin gestorben") a.remove();
        });

        localStorage.setItem("links", temp.innerHTML);
    }

    function loadLinks() {
        removeDeadLink();
        const saved = localStorage.getItem("links");
        if (!saved) return;

        linksDiv.innerHTML = saved;
        linksDiv.querySelectorAll(".linkBtn").forEach(btn => {
            btn.onclick = () => {
                const c = btn.parentElement;
                const a = c.querySelector("a");
                undoStack.push({ title: a.textContent, url: a.href });
                c.remove();
                saveLinks();
            };
        });
    }

    function addLink() {
        const title = document.getElementById("title").value.trim();
        const url = document.getElementById("url").value.trim();
        if (!title || !url) return alert("Titel und URL erforderlich");

        const c = document.createElement("div");
        c.className = "linkContainer";

        const a = document.createElement("a");
        a.href = url;
        a.textContent = title;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        const del = document.createElement("button");
        del.textContent = "❌ Löschen";
        del.className = "linkBtn";
        del.onclick = () => {
            undoStack.push({ title, url });
            c.remove();
            saveLinks();
        };

        c.appendChild(a);
        c.appendChild(del);
        linksDiv.appendChild(c);
        saveLinks();

        document.getElementById("title").value = "";
        document.getElementById("url").value = "";
    }

    function undoDelete() {
        if (!undoStack.length) return alert("Nichts zum Wiederherstellen");

        const { title, url } = undoStack.pop();
        document.getElementById("title").value = title;
        document.getElementById("url").value = url;
        addLink();
    }

    document.getElementById("addBtn").onclick = addLink;
    document.getElementById("restoreBtn").onclick = loadLinks;
    document.getElementById("undoBtn").onclick = undoDelete;

    loadLinks();
</script>

</body>
</html>
