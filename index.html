<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Externe Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
    font-family:Arial,Roboto,sans-serif;
    background:#0f0f0f;
    color:#fff;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center
}
.app{width:100%;max-width:520px}
h2{text-align:center;margin-bottom:14px}

input,button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:8px;
    border:none;
    font-size:15px
}
input{background:#222;color:#fff}
button{font-weight:bold;cursor:pointer}

#addBtn{background:#ff0000;color:#fff}
#addBtn:hover{background:#cc0000}

.row{display:flex;gap:8px;flex-wrap:wrap}

.linkBtn{
    background:#333;
    color:#fff;
    padding:8px 10px;
    border-radius:6px;
    font-size:13px
}
.linkBtn:hover{background:#555}

.link{
    background:#1a1a1a;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
    display:flex;
    flex-direction:column;
    gap:6px
}

a{color:#3ea6ff;text-decoration:none;word-break:break-all}
hr{border:0;border-top:1px solid #333;margin:16px 0}
.hidden{display:none}
</style>
</head>
<body>

<div class="app">
<h2>🔗 Externe Links</h2>

<input id="title" placeholder="Linktitel">
<input id="url" placeholder="https://example.com">

<button id="addBtn" class="hidden">+ Link hinzufügen</button>

<div class="row">
    <button id="loginBtn" class="linkBtn">🔐 Admin Login</button>
    <button id="logoutBtn" class="linkBtn hidden">🔓 Logout</button>
</div>

<hr>
<div id="links"></div>
</div>

<script>
/* ===== OWNER PIN ===== */
const OWNER_PIN = "1234"; // 🔑 HIER PIN SETZEN

let role = "viewer"; // viewer | owner
const linksDiv = document.getElementById("links");

function save(){ localStorage.setItem("links", linksDiv.innerHTML); }

function renderControls(){
    document.getElementById("addBtn").classList.toggle("hidden", role!=="owner");
    document.getElementById("logoutBtn").classList.toggle("hidden", role!=="owner");
    document.getElementById("loginBtn").classList.toggle("hidden", role==="owner");

    linksDiv.querySelectorAll(".del").forEach(b=>{
        b.style.display = role==="owner"?"block":"none";
    });
}

function load(){
    linksDiv.innerHTML = localStorage.getItem("links") || "";
    renderControls();
}

function addLink(){
    if(role!=="owner") return;

    const t = title.value.trim();
    const u = url.value.trim();
    if(!t||!u) return alert("Titel & URL fehlen");

    const d = document.createElement("div");
    d.className="link";

    const a = document.createElement("a");
    a.href=u; a.textContent=t; a.target="_blank";

    const del=document.createElement("button");
    del.textContent="❌ Löschen";
    del.className="linkBtn del";
    del.onclick=()=>{ d.remove(); save(); };

    d.append(a,del);
    linksDiv.appendChild(d);
    save();

    title.value=""; url.value="";
    renderControls();
}

document.getElementById("loginBtn").onclick=()=>{
    const pin=prompt("Owner PIN:");
    if(pin===OWNER_PIN){
        role="owner";
        alert("Admin aktiviert");
        renderControls();
    }else alert("Falsche PIN");
};

document.getElementById("logoutBtn").onclick=()=>{
    role="viewer";
    renderControls();
};

document.getElementById("addBtn").onclick=addLink;

load();
</script>

</body>
</html>
