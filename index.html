<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Meine externen Links</title>

<style>
body {
    font-family: Roboto, Arial, sans-serif;
    background: #0f0f0f;
    color: #ffffff;
    padding: 30px;
}

h2 {
    font-weight: 500;
    margin-bottom: 20px;
}

input, button {
    padding: 10px;
    margin: 6px 0;
    width: 320px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
}

input {
    background: #222;
    color: #fff;
}

button {
    font-weight: bold;
    cursor: pointer;
    margin-right: 5px;
}

#addBtn {
    background: #ff0000;
    color: #fff;
}

#addBtn:hover {
    background: #cc0000;
}

.linkBtn {
    background: #333;
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
}

.linkBtn:hover {
    background: #555;
}

a {
    color: #3ea6ff;
    text-decoration: none;
    margin-top: 8px;
    display: inline-block;
}

.linkContainer {
    margin-bottom: 8px;
}
</style>
</head>

<body>

<h2>🔗 Externe Links</h2>

<input id="title" placeholder="Linktitel eingeben">
<br>
<input id="url" type="url" placeholder="https://example.com">
<br>
<button id="addBtn">+ Link hinzufügen</button>
<button onclick="restoreLinks()" class="linkBtn">🔄 Wiederherstellen</button>

<hr>

<div id="links"></div>

<script>
const linksDiv = document.getElementById("links");

function saveLinks() {
    localStorage.setItem("links", linksDiv.innerHTML);
}

function loadLinks() {
    const saved = localStorage.getItem("links");
    if (saved) linksDiv.innerHTML = saved;
}

function addLink() {
    const title = document.getElementById("title").value.trim();
    const url = document.getElementById("url").value.trim();

    if (!title || !url) {
        alert("Titel und URL erforderlich");
        return;
    }

    const container = document.createElement("div");
    container.className = "linkContainer";

    const a = document.createElement("a");
    a.href = url;
    a.textContent = title;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const delBtn = document.createElement("button");
    delBtn.textContent = "❌ Löschen";
    delBtn.className = "linkBtn";
    delBtn.onclick = () => {
        container.remove();
        saveLinks();
    };

    container.appendChild(a);
    container.appendChild(delBtn);
    linksDiv.appendChild(container);

    saveLinks();

    document.getElementById("title").value = "";
    document.getElementById("url").value = "";
}

function restoreLinks() {
    const saved = localStorage.getItem("links");
    if (saved) {
        linksDiv.innerHTML = saved;
    } else {
        alert("Keine gespeicherten Links zum Wiederherstellen.");
    }
}

// Event Listener für Add-Button
document.getElementById("addBtn").addEventListener("click", addLink);

// Lade Links beim Start
loadLinks();
</script>

</body>
</html>
