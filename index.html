<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>🔗 Externe Links | Projekt-Übersicht</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:#0f0f0f;
    color:#fff;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
}
.app{width:100%;max-width:520px}
h2{text-align:center}

input,button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    font-size:15px;
}
input{background:#222;color:#fff;border:1px solid #333}
button{cursor:pointer;font-weight:bold}
#addBtn{background:#38bdf8;color:#000}
.row{display:flex;gap:10px;flex-wrap:wrap}
.linkBtn{background:#333;color:#fff;border-radius:8px}
.link{
    background:#1a1a1a;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
a{color:#3ea6ff;text-decoration:none;flex:1}
.del{background:#442222;color:#ff6666;padding:6px 10px;border-radius:6px}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">
    <h2>🔗 Externe Links</h2>

    <div id="adminArea" class="hidden">
        <input id="title" placeholder="Linktitel">
        <input id="url" placeholder="https://example.com">
        <button id="addBtn">+ Link hinzufügen</button>
    </div>

    <div class="row">
        <button id="loginBtn" class="linkBtn">🔐 Admin Login</button>
        <button id="logoutBtn" class="linkBtn hidden">🔓 Logout</button>
        <button id="undoBtn" class="linkBtn hidden">↩️ Rückgängig</button>
    </div>

    <hr>
    <div id="links"></div>
</div>

<script>
// ==========================================
// KONFIGURATION
// ==========================================

// 👉 HIER PIN ÄNDERN
const ADMIN_PIN = "5402";

// ==========================================
// STANDARD LINKS
// ==========================================
const defaultLinks = [
    { title: "🎄 Adventskalender", url: "https://kalirusi5511.github.io/Adventskalender/" },
    { title: "🛒 Mein Markt Plugin Projekt", url: "https://kalirusi5511.github.io/Mein-Markt-Plugin-Projekt/" },
    { title: "📢 WhatsApp Channel", url: "https://whatsapp.com/channel/0029Vb62Zu4DTkK6HVAfJZ39" },
    { title: "🎮 Discord Server", url: "https://discord.gg/NQ2rjRQE" }
];

// ==========================================
// VARIABLEN
// ==========================================
let role = "viewer";
let linksData = [];
let undoStack = [];
let PIN_HASH = null;

const linksDiv = document.getElementById("links");
const adminArea = document.getElementById("adminArea");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const undoBtn = document.getElementById("undoBtn");

// ==========================================
// HASH FUNKTION
// ==========================================
async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(hash)]
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

// ==========================================
// INIT
// ==========================================
async function init(){
    PIN_HASH = await sha256(ADMIN_PIN);

    const saved = localStorage.getItem("linksData");
    linksData = saved ? JSON.parse(saved) : [...defaultLinks];
    render();
}

// ==========================================
// RENDER
// ==========================================
function render(){
    linksDiv.innerHTML = "";
    linksData.forEach((l, i) => {
        const div = document.createElement("div");
        div.className = "link";

        div.innerHTML = `<a href="${l.url}" target="_blank">${l.title}</a>`;

        if(role === "owner"){
            const del = document.createElement("button");
            del.textContent = "Löschen";
            del.className = "del";
            del.onclick = () => {
                undoStack.push(linksData[i]);
                linksData.splice(i,1);
                save();
            };
            div.appendChild(del);
        }
        linksDiv.appendChild(div);
    });

    adminArea.classList.toggle("hidden", role !== "owner");
    loginBtn.classList.toggle("hidden", role === "owner");
    logoutBtn.classList.toggle("hidden", role !== "owner");
    undoBtn.classList.toggle("hidden", undoStack.length === 0 || role !== "owner");
}

function save(){
    localStorage.setItem("linksData", JSON.stringify(linksData));
    render();
}

// ==========================================
// EVENTS
// ==========================================
loginBtn.onclick = async () => {
    const pin = prompt("Admin PIN eingeben:");
    if(!pin) return;

    const hash = await sha256(pin);
    if(hash === PIN_HASH){
        role = "owner";
        render();
    } else {
        alert("❌ PIN falsch");
    }
};

logoutBtn.onclick = () => {
    role = "viewer";
    render();
};

document.getElementById("addBtn").onclick = () => {
    const t = title.value.trim();
    const u = url.value.trim();
    if(t && u){
        linksData.push({title:t, url:u});
        title.value = "";
        url.value = "";
        save();
    }
};

undoBtn.onclick = () => {
    if(undoStack.length){
        linksData.push(undoStack.pop());
        save();
    }
};

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
